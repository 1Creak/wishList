# Free Supabase projects are paused after 7 days without requests.
# This pings the database every 3 days so the site keeps working.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -a; source .env.production; set +a
          curl --fail --silent --show-error \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/profiles?select=id&limit=1" > /dev/null
          echo "Supabase is awake"
